name: Build Windows Native Backend Binary

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release asset if tag is present'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'scripts/compile_windows.*'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Compile Windows .EXE (Nuitka C++ Native)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies & Nuitka Compiler
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx
          pip install nuitka ordered-set zstandard

      - name: Run Backend Automated Test Suite
        run: |
          pytest backend/test_api.py -v

      - name: Compile Backend to Native Windows Machine Code
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --include-package=app `
            --include-package=uvicorn `
            --include-package=sqlalchemy `
            --include-package=pydantic `
            --include-package=pymysql `
            --include-package=cryptography `
            --follow-imports `
            --output-dir=dist_backend `
            -o craft-backend.exe `
            backend/run_server.py

      - name: Self-Test Compiled Executable (--help)
        run: |
          .\dist_backend\run_server.dist\craft-backend.exe --help

      - name: Package Clean Client Delivery Bundle (Zero .py Source Code)
        shell: powershell
        run: |
          $bundleDir = "craft-backend-windows-bundle"
          if (Test-Path $bundleDir) { Remove-Item -Recurse -Force $bundleDir }
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null

          # Copy compiled binary and bundled DLLs
          Copy-Item -Recurse -Force "dist_backend\run_server.dist\*" $bundleDir
          Copy-Item -Force "backend\.env.example" "$bundleDir\.env.example"

          # Create Client README
          $readme = @"
          ==============================================================================
          CRAFT & GI PRODUCT VERIFICATION BACKEND (WINDOWS STANDALONE)
          ==============================================================================

          This is a standalone compiled C++ binary distribution.
          No Python runtime, virtual environment, or external dependencies required.

          QUICK START:
          1. Copy .env.example to .env:
             copy .env.example .env

          2. (Optional) Seed default authentic GI products:
             craft-backend.exe --seed

          3. Start the server:
             craft-backend.exe --host 0.0.0.0 --port 8000

          4. Verify in browser:
             - Swagger API Docs : http://localhost:8000/docs
             - Health Check     : http://localhost:8000/health
          ==============================================================================
          "@
          Set-Content -Path "$bundleDir\README.txt" -Value $readme

          # IP Protection Verification: Ensure zero .py source files exist
          $pyFiles = Get-ChildItem -Recurse -Path $bundleDir -Filter *.py
          if ($pyFiles.Count -gt 0) {
              Write-Error "CRITICAL: Detected Python files inside client bundle! Aborting build."
              exit 1
          }
          Write-Host "[+] Source code protection verified: 0 .py files found." -ForegroundColor Green

          # Compress into release zip
          Compress-Archive -Path "$bundleDir\*" -DestinationPath "craft-backend-windows-bundle.zip" -Force
          Write-Host "[+] Client delivery bundle packaged: craft-backend-windows-bundle.zip" -ForegroundColor Green

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: craft-backend-windows-bundle
          path: craft-backend-windows-bundle.zip
          retention-days: 14

      - name: Publish Release Asset (If Tagged)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: craft-backend-windows-bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
